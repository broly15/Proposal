<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  overflow: hidden;
}

h1 {
  font-size: 32px;
  color: white;
  text-align: center;
  animation: fadeIn 1.5s ease;
}

.buttons {
  margin-top: 20px;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
  position: relative;
}

#yes {
  background: #ff4d6d;
  color: white;
  box-shadow: 0 0 15px rgba(255,77,109,0.6);
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #ffffff;
  color: #333;
  position: absolute;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: white;
  animation: fall 3s linear infinite;
}

@keyframes fall {
  0% {transform: translateY(-100vh);}
  100% {transform: translateY(100vh);}
}
</style>

</head>

<body>

<h1 id="question">Will you be my girlfriend? ❤️</h1>

<div class="buttons">
  <button id="yes" onclick="yesClicked()">YES 💛</button>
  <button id="no" onclick="noClicked()">NO 🙃</button>
</div>

<script>
let messages = [
  "Are you sure? 😅",
  "Like... really sure?",
  "Think again maybe? 👀",
  "That didn’t feel right… try again 🥲",
  "I think you misclicked 😌",
  "Okay now you're just playing with me 😭",
  "Last chance… think carefully 💭",
  "You’re making this harder than it should be 😏",
  "Come on… you know the right answer 😉",
  "Final final chance 😤"
];

let index = 0;

function noClicked() {
  document.getElementById("question").innerText = messages[index];
  index = (index + 1) % messages.length;

  // Move button randomly
  let btn = document.getElementById("no");
  let x = Math.random() * (window.innerWidth - 100);
  let y = Math.random() * (window.innerHeight - 50);
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

function yesClicked() {
  document.body.innerHTML = `
    <h1>❤️ You just made me the happiest guy ❤️</h1>
    <p style="color:white; font-size:20px;">Now come here… I deserve a hug 😌</p>
  `;

  // Confetti
  for(let i=0; i<50; i++){
    let conf = document.createElement("div");
    conf.className = "confetti";
    conf.style.left = Math.random()*100 + "vw";
    conf.style.animationDuration = (Math.random()*3+2)+"s";
    document.body.appendChild(conf);
  }
}
</script>

</body>
</html>
